# libca-em CI（Linux + Windows × x86 / x64 / aarch64）
#
# 范围：全部 em 模块 + unittests/ 下 62 个主机可跑的 test-* 二进制
# （自研 em_test 框架，成功退出 0，失败非 0）。
#
# 说明：
# - 不含 demo/：demo 目标需要 arm-none-eabi 交叉工具链（ota 硬件工程），
#   CI 只覆盖主机构建与单测；交叉编译由消费工程（ota_demo）侧验证。
# - em_eimui 的 SDL 测试由 enable_em_eimui_test 开关守护（默认关），CI 不拉
#   SDL 依赖。
# - unittests 中的 user-mode 用例同时验证 libca.em 源码包管理器契约
#   （em.setup / em.add_libs 的依赖补全与配置矩阵）。
#
# 矩阵（构建 + 运行单测）：
# - linux x64：原生构建直跑。
# - linux i386：gcc-multilib（-m32）构建，x64 内核直跑 32 位测试。
# - linux aarch64：aarch64-linux-gnu-gcc 交叉构建，qemu-user-static 运行测试。
# - windows x64：MSVC 原生构建直跑。
# - windows x86：MSVC 交叉构建，测试经 WoW64 直跑。
# - windows arm64：windows-11-arm 原生 runner，原生构建直跑。

name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "unittests/**"
      - "xmake/**"
      - "xmake.lua"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "src/**"
      - "unittests/**"
      - "xmake/**"
      - "xmake.lua"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test (${{ matrix.plat }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux（x64 宿主机）----
          - os: ubuntu-latest
            plat: linux
            arch: x64
          - os: ubuntu-latest
            plat: linux
            arch: i386
            apt-packages: gcc-multilib
          - os: ubuntu-latest
            plat: linux
            arch: aarch64
            apt-packages: "gcc-aarch64-linux-gnu qemu-user-static"
            cross: "aarch64-linux-gnu-"
            run-prefix: "qemu-aarch64-static -L /usr/aarch64-linux-gnu"
          # ---- Windows ----
          - os: windows-latest
            plat: windows
            arch: x64
          - os: windows-latest
            plat: windows
            arch: x86
          - os: windows-11-arm
            plat: windows
            arch: arm64
    env:
      CI_PLAT: ${{ matrix.plat }}
      CI_ARCH: ${{ matrix.arch }}
      CI_CROSS: ${{ matrix.cross }}
      CI_RUN_PREFIX: ${{ matrix.run-prefix }}
      CI_APT_PACKAGES: ${{ matrix.apt-packages }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains (linux cross / i386)
        if: runner.os == 'Linux' && matrix.apt-packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y $CI_APT_PACKAGES

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.9
          actions-cache-folder: '.xmake-cache'

      - name: Configure
        shell: bash
        run: |
          args=(-p "$CI_PLAT" -a "$CI_ARCH" -m release -y)
          if [ -n "$CI_CROSS" ]; then
            args+=(--cross "$CI_CROSS")
          fi
          xmake f "${args[@]}"

      - name: Build
        run: xmake -y

      - name: Run unit tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BINS=$(find build -type f -name "test-*.exe" | sort)
          else
            BINS=$(find build -type f -name "test-*" -executable | sort)
          fi
          echo "test binaries found: $(echo "$BINS" | grep -c . )"
          fail=0
          for f in $BINS; do
            echo "== running $f"
            $CI_RUN_PREFIX "$f" || { echo "FAILED: $f"; fail=1; }
          done
          exit $fail
